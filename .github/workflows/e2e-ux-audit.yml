name: E2E UX Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/**"
      - "apps/web/e2e/**"
      - "apps/web/playwright.config.ts"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "docs/ux/**"
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: e2e-ux-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: perf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/perf?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run UX audit suite
        run: npm run test:e2e:ux

      - name: Upload UX audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            docs/ux/UX_AUDIT_REPORT.md
          if-no-files-found: ignore
          retention-days: 7

